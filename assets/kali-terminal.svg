<svg width="800" height="245" viewBox="0 0 800 245" xmlns="http://www.w3.org/2000/svg">
  <!-- Window Outer Frame -->
  <rect x="2" y="2" width="796" height="241" rx="8" ry="8" fill="#12151C" stroke="#2D333F" stroke-width="2"/>

  <!-- XFCE Dark Title Bar -->
  <path d="M 3 10 Q 3 3 10 3 L 790 3 Q 797 3 797 10 L 797 32 L 3 32 Z" fill="#1F242D"/>
  <line x1="3" y1="32" x2="797" y2="32" stroke="#0B0D11" stroke-width="1"/>

  <!-- Window Controls (Left/Right XFCE Style) -->
  <circle cx="20" cy="17" r="6" fill="#FF5F56"/>
  <circle cx="40" cy="17" r="6" fill="#FFBD2E"/>
  <circle cx="60" cy="17" r="6" fill="#27C93F"/>
  <text x="400" y="21" text-anchor="middle" font-family="Fira Code, Consolas, monospace" font-size="12" fill="#A9B1D6">
    sujal@kali: ~ (zsh)
  </text>

  <!-- Kali Zsh Prompt Line 1 -->
  <text x="20" y="60" font-family="Fira Code, Consolas, monospace" font-size="14" font-weight="bold">
    <tspan fill="#367BF0">┌──(</tspan><tspan fill="#FF3E3E">sujal㉿kali</tspan><tspan fill="#367BF0">)-[</tspan><tspan fill="#FFFFFF">~</tspan><tspan fill="#367BF0">]</tspan>
  </text>
  <!-- Kali Zsh Prompt Line 2 -->
  <text x="20" y="80" font-family="Fira Code, Consolas, monospace" font-size="14" font-weight="bold">
    <tspan fill="#367BF0">└─</tspan><tspan fill="#FF3E3E">$</tspan><tspan fill="#FFFFFF"> neofetch --ascii_distro kali</tspan>
  </text>

  <!-- Mini Kali Dragon / Shield Emblem on Left -->
  <g transform="translate(26, 98)">
    <rect x="0" y="0" width="115" height="122" rx="6" fill="#181D27" stroke="#367BF0" stroke-width="1.5"/>
    <text x="57" y="48" text-anchor="middle" font-family="Consolas, monospace" font-size="11" font-weight="bold" fill="#367BF0">
      ..-"""""-..
    </text>
    <text x="57" y="62" text-anchor="middle" font-family="Consolas, monospace" font-size="11" font-weight="bold" fill="#367BF0">
      /  K A L I  \
    </text>
    <text x="57" y="76" text-anchor="middle" font-family="Consolas, monospace" font-size="11" font-weight="bold" fill="#367BF0">
      \  L I N U X /
    </text>
    <text x="57" y="90" text-anchor="middle" font-family="Consolas, monospace" font-size="11" font-weight="bold" fill="#367BF0">
      '-.....-'
    </text>
    <text x="57" y="110" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#7AA2F7">
      [2026.4 ROLLING]
    </text>
  </g>

  <!-- Neofetch Output on Right -->
  <g font-family="Fira Code, Consolas, monospace" font-size="13">
    <text x="165" y="112"><tspan fill="#367BF0" font-weight="bold">sujal</tspan><tspan fill="#FFFFFF">@</tspan><tspan fill="#367BF0" font-weight="bold">kali-rolling</tspan></text>
    <text x="165" y="128" fill="#565F89">----------------------</text>
    <text x="165" y="146"><tspan fill="#367BF0" font-weight="bold">Role:</tspan><tspan fill="#C0CAF5"> SE IT Student @ PDEA's COEM, Pune</tspan></text>
    <text x="165" y="165"><tspan fill="#367BF0" font-weight="bold">Focus:</tspan><tspan fill="#C0CAF5"> Offline AI • Embedded Systems • Security</tspan></text>
    <text x="165" y="184"><tspan fill="#367BF0" font-weight="bold">Stack:</tspan><tspan fill="#C0CAF5"> Python • C/C++ • Arduino • MediaPipe • Linux</tspan></text>
    <text x="165" y="203"><tspan fill="#367BF0" font-weight="bold">Shell:</tspan><tspan fill="#9ECE6A"> zsh 5.9 (pentest &amp; dev environment)</tspan></text>

    <!-- Terminal Color Palette Blocks -->
    <rect x="165" y="213" width="18" height="10" fill="#15161E"/>
    <rect x="185" y="213" width="18" height="10" fill="#F7768E"/>
    <rect x="205" y="213" width="18" height="10" fill="#9ECE6A"/>
    <rect x="225" y="213" width="18" height="10" fill="#E0AF68"/>
    <rect x="245" y="213" width="18" height="10" fill="#367BF0"/>
    <rect x="265" y="213" width="18" height="10" fill="#BB9AF7"/>
    <rect x="285" y="213" width="18" height="10" fill="#7DCFFF"/>
  </g>
</svg>
